<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣觀測 - Open-Meteo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background 0.5s ease;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-400 via-sky-200 to-indigo-300 text-slate-800 p-4 md:p-8 flex flex-col justify-between">

    <!-- 主要容器 -->
    <div class="max-w-4xl mx-auto w-full space-y-6">
        
        <!-- 頂部標題與縣市選擇 -->
        <header class="glass-panel rounded-3xl p-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-md">
                    <i class="fa-solid fa-cloud-sun-rain text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">台灣即時天氣觀測</h1>
                    <p class="text-xs text-slate-500">資料來源：Open-Meteo API</p>
                </div>
            </div>

            <!-- 選擇縣市下拉選單 -->
            <div class="w-full sm:w-auto relative">
                <select id="citySelect" class="w-full sm:w-48 appearance-none bg-white/90 border border-slate-200 text-slate-700 font-medium py-2.5 px-4 pr-10 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                    <!-- 縣市選項將由 JS 動態生成 -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                    <i class="fa-solid fa-chevron-down text-sm"></i>
                </div>
            </div>
        </header>

        <!-- 主要天氣資訊區塊 -->
        <main id="weatherContainer" class="space-y-6">
            
            <!-- 載入中狀態 (預設顯示) -->
            <div id="loading" class="glass-panel rounded-3xl p-12 text-center shadow-xl space-y-4">
                <div class="inline-block animate-spin text-blue-600 text-4xl">
                    <i class="fa-solid fa-circle-notch"></i>
                </div>
                <p class="text-slate-600 font-medium">正在取得天氣數據中...</p>
            </div>

            <!-- 天氣內容顯示區塊 (讀取後解除隱藏) -->
            <div id="weatherContent" class="hidden space-y-6">
                
                <!-- 當前天氣大卡片 -->
                <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-xl relative overflow-hidden">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        
                        <!-- 左側：城市名與目前溫度 -->
                        <div class="space-y-2">
                            <div class="inline-flex items-center space-x-2 bg-blue-100/80 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">
                                <i class="fa-solid fa-location-dot"></i>
                                <span id="currentCityName">台北市</span>
                            </div>
                            <div class="flex items-baseline space-x-2">
                                <h2 id="currentTemp" class="text-6xl md:text-7xl font-extrabold tracking-tight text-slate-900">--°C</h2>
                            </div>
                            <p id="weatherDesc" class="text-lg font-medium text-slate-700">--</p>
                        </div>

                        <!-- 右側：主要天氣圖示與體感 -->
                        <div class="flex items-center space-x-6 self-center md:self-auto">
                            <div id="weatherIconContainer" class="text-6xl md:text-7xl text-amber-500 filter drop-shadow-md">
                                <i class="fa-solid fa-sun"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 數值細節列 -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-6 border-t border-slate-200/60">
                        <div class="bg-white/50 p-3 rounded-2xl flex items-center space-x-3">
                            <div class="text-blue-500 text-xl w-8 text-center"><i class="fa-solid fa-temperature-half"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-medium">體感溫度</div>
                                <div id="apparentTemp" class="text-base font-bold text-slate-800">--°C</div>
                            </div>
                        </div>

                        <div class="bg-white/50 p-3 rounded-2xl flex items-center space-x-3">
                            <div class="text-cyan-500 text-xl w-8 text-center"><i class="fa-solid fa-droplet"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-medium">相對濕度</div>
                                <div id="humidity" class="text-base font-bold text-slate-800">--%</div>
                            </div>
                        </div>

                        <div class="bg-white/50 p-3 rounded-2xl flex items-center space-x-3">
                            <div class="text-indigo-500 text-xl w-8 text-center"><i class="fa-solid fa-umbrella"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-medium">降雨機率</div>
                                <div id="pop" class="text-base font-bold text-slate-800">--%</div>
                            </div>
                        </div>

                        <div class="bg-white/50 p-3 rounded-2xl flex items-center space-x-3">
                            <div class="text-teal-500 text-xl w-8 text-center"><i class="fa-solid fa-wind"></i></div>
                            <div>
                                <div class="text-xs text-slate-500 font-medium">風速</div>
                                <div id="windSpeed" class="text-base font-bold text-slate-800">-- km/h</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 一週天氣預報 -->
                <div class="glass-panel rounded-3xl p-6 shadow-xl">
                    <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-calendar-week text-blue-600"></i>
                        <span>未來 7 天預報</span>
                    </h3>
                    
                    <div id="forecastContainer" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                        <!-- 7 天預報項目由 JS 動態增刪 -->
                    </div>
                </div>

            </div>
        </main>

        <!-- 頁尾資訊 -->
        <footer class="text-center text-xs text-slate-600 space-y-1 py-4">
            <p>使用 Open-Meteo 免費 API 打造原生 JavaScript 天氣應用</p>
            <p id="lastUpdated">最後更新時間：--</p>
        </footer>
    </div>

    <!-- 邏輯程式碼 -->
    <script>
        // 台灣 22 縣市經緯度資料對照表
        const TAIWAN_CITIES = [
            { name: "基隆市", lat: 25.1283, lon: 121.7419 },
            { name: "臺北市", lat: 25.0330, lon: 121.5654 },
            { name: "新北市", lat: 25.0170, lon: 121.4625 },
            { name: "桃園市", lat: 24.9936, lon: 121.3010 },
            { name: "新竹市", lat: 24.8138, lon: 120.9675 },
            { name: "新竹縣", lat: 24.8383, lon: 121.0177 },
            { name: "苗栗縣", lat: 24.5601, lon: 120.8214 },
            { name: "臺中市", lat: 24.1477, lon: 120.6736 },
            { name: "彰化縣", lat: 24.0518, lon: 120.5161 },
            { name: "南投縣", lat: 23.9099, lon: 120.6869 },
            { name: "雲林縣", lat: 23.7092, lon: 120.4313 },
            { name: "嘉義市", lat: 23.4800, lon: 120.4491 },
            { name: "嘉義縣", lat: 23.4588, lon: 120.2927 },
            { name: "臺南市", lat: 22.9997, lon: 120.2270 },
            { name: "高雄市", lat: 22.6273, lon: 120.3014 },
            { name: "屏東縣", lat: 22.6713, lon: 120.4880 },
            { name: "宜蘭縣", lat: 24.7021, lon: 121.7377 },
            { name: "花蓮縣", lat: 23.9871, lon: 121.6016 },
            { name: "臺東縣", lat: 22.7613, lon: 121.1444 },
            { name: "澎湖縣", lat: 23.5711, lon: 119.5793 },
            { name: "金門縣", lat: 24.4493, lon: 118.3766 },
            { name: "連江縣", lat: 26.1505, lon: 119.9499 }
        ];

        // Open-Meteo 天氣代碼 (WMO Weather interpretation codes) 轉中文及圖示
        function getWMOWeatherDetails(code) {
            const wmoMap = {
                0: { desc: "晴朗無雲", icon: "fa-sun", color: "text-amber-500" },
                1: { desc: "大致晴朗", icon: "fa-sun-cloud", color: "text-amber-400" },
                2: { desc: "多雲時晴", icon: "fa-cloud-sun", color: "text-sky-400" },
                3: { desc: "陰天", icon: "fa-cloud", color: "text-slate-400" },
                45: { desc: "有霧", icon: "fa-smog", color: "text-slate-400" },
                48: { desc: "濃霧", icon: "fa-smog", color: "text-slate-500" },
                51: { desc: "輕微毛毛雨", icon: "fa-cloud-rain", color: "text-blue-400" },
                53: { desc: "毛毛雨", icon: "fa-cloud-rain", color: "text-blue-500" },
                55: { desc: "大毛毛雨", icon: "fa-cloud-showers-heavy", color: "text-blue-600" },
                61: { desc: "小雨", icon: "fa-cloud-rain", color: "text-blue-400" },
                63: { desc: "中雨", icon: "fa-cloud-showers-heavy", color: "text-blue-600" },
                65: { desc: "豪雨", icon: "fa-cloud-showers-heavy", color: "text-blue-700" },
                80: { desc: "陣雨", icon: "fa-cloud-sun-rain", color: "text-sky-500" },
                81: { desc: "強烈陣雨", icon: "fa-cloud-showers-heavy", color: "text-blue-600" },
                82: { desc: "局暴雨", icon: "fa-cloud-bolt", color: "text-indigo-600" },
                95: { desc: "雷陣雨", icon: "fa-cloud-bolt", color: "text-amber-600" },
                96: { desc: "雷陣雨伴隨冰雹", icon: "fa-cloud-meatball", color: "text-indigo-700" }
            };

            return wmoMap[code] || { desc: "多雲", icon: "fa-cloud", color: "text-slate-400" };
        }

        // 初始化下拉選單
        function initCitySelect() {
            const selectEl = document.getElementById("citySelect");
            TAIWAN_CITIES.forEach((city, index) => {
                const opt = document.createElement("option");
                opt.value = index;
                opt.textContent = city.name;
                selectEl.appendChild(opt);
            });

            // 預設選擇 臺北市 (索引 1)
            selectEl.value = 1;

            // 監聽選單變更事件
            selectEl.addEventListener("change", (e) => {
                const cityIndex = e.target.value;
                fetchWeatherData(TAIWAN_CITIES[cityIndex]);
            });
        }

        // 呼叫 Open-Meteo API 抓取資料
        async function fetchWeatherData(city) {
            const loadingEl = document.getElementById("loading");
            const contentEl = document.getElementById("weatherContent");

            // 顯示載入動畫
            loadingEl.classList.remove("hidden");
            contentEl.classList.add("hidden");

            try {
                // Open-Meteo API URL
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTaipei`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("網路回應異常");

                const data = await response.json();
                
                // 渲染畫面
                renderCurrentWeather(city.name, data.current, data.daily);
                renderForecast(data.daily);

                // 隱藏載入中，顯示內容
                loadingEl.classList.add("hidden");
                contentEl.classList.remove("hidden");

            } catch (error) {
                console.error("無法抓取天氣資料：", error);
                alert("抓取天氣數據失敗，請稍後再試！");
            }
        }

        // 渲染當前天氣資料
        function renderCurrentWeather(cityName, current, daily) {
            document.getElementById("currentCityName").textContent = cityName;
            document.getElementById("currentTemp").textContent = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById("apparentTemp").textContent = `${Math.round(current.apparent_temperature)}°C`;
            document.getElementById("humidity").textContent = `${current.relative_humidity_2m}%`;
            document.getElementById("windSpeed").textContent = `${current.wind_speed_10m} km/h`;
            
            // 當天最大降雨機率
            const todayPop = daily.precipitation_probability_max[0] ?? 0;
            document.getElementById("pop").textContent = `${todayPop}%`;

            // 天氣代碼對應狀態
            const weatherDetails = getWMOWeatherDetails(current.weather_code);
            document.getElementById("weatherDesc").textContent = weatherDetails.desc;

            // 更新圖示
            const iconContainer = document.getElementById("weatherIconContainer");
            iconContainer.className = `text-6xl md:text-7xl filter drop-shadow-md ${weatherDetails.color}`;
            iconContainer.innerHTML = `<i class="fa-solid ${weatherDetails.icon}"></i>`;

            // 更新最後更新時間
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            document.getElementById("lastUpdated").textContent = `最後更新時間：${timeStr}`;
        }

        // 渲染未來 7 天預報
        function renderForecast(daily) {
            const container = document.getElementById("forecastContainer");
            container.innerHTML = ""; // 清空舊內容

            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            for (let i = 0; i < daily.time.length; i++) {
                const date = new Date(daily.time[i]);
                const dayName = i === 0 ? "今天" : days[date.getDay()];
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);
                const weatherDetails = getWMOWeatherDetails(daily.weather_code[i]);
                const pop = daily.precipitation_probability_max[i] ?? 0;

                const card = document.createElement("div");
                card.className = "bg-white/60 p-3 rounded-2xl text-center space-y-2 flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow";
                
                card.innerHTML = `
                    <div class="text-xs font-bold text-slate-700">${dayName}</div>
                    <div class="text-xs text-slate-400">${date.getMonth() + 1}/${date.getDate()}</div>
                    <div class="text-2xl my-1 ${weatherDetails.color}">
                        <i class="fa-solid ${weatherDetails.icon}"></i>
                    </div>
                    <div class="text-xs text-slate-600 font-medium">${weatherDetails.desc}</div>
                    <div class="text-xs font-semibold text-slate-800">${maxTemp}° / ${minTemp}°</div>
                    <div class="text-[10px] text-blue-500 font-medium flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-umbrella text-[9px]"></i>
                        <span>${pop}%</span>
                    </div>
                `;

                container.appendChild(card);
            }
        }

        // 頁面載入後自動執行
        window.onload = function() {
            initCitySelect();
            // 預設載入 臺北市 (TAIWAN_CITIES[1])
            fetchWeatherData(TAIWAN_CITIES[1]);
        };
    </script>
</body>
</html>
