<!doctype html><html lang="zh-Hant"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBS文章備份程式</title>
<style>
* { box-sizing: border-box; }
body { color-scheme: dark; font: 15px/1.45 system-ui, sans-serif; background: #000; color: #e0e0e0;
       max-width: 1100px; margin: 0 auto; padding: 12px 18px; }
h1 { font-size: 1.35rem; margin: 0; color: #ffff66; }
a { color: #b5edff; }
.heading { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;
           gap: 8px; margin-bottom: 10px; padding: 8px 12px; background: #0c0a66; }
h2 { font-size: 1.12rem; margin: 0; }
main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
form, section, dialog { background: #10121a; padding: 12px; border: 1px solid #343952; }
form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
label { display: block; grid-column: span 2; min-width: 0; }
label[hidden] { display: none; }
.half { grid-column: span 3; }
.wide { grid-column: 1 / -1; }
input:not([type=checkbox],[type=hidden]), select { display: block; width: 100%; padding: 6px 8px; margin-top: 3px;
    color: inherit; background: #070910; font: inherit; border: 1px solid #59658b; border-radius: 3px; }
button { padding: 5px 9px; font: inherit; color: inherit; background: #202441;
         border: 1px solid #59658b; border-radius: 3px; cursor: pointer; }
button:disabled { cursor: default; }
input:disabled, select:disabled { opacity: .5; }
#start-error { color: #ffadad; }
#run { color: #ffffa0; background: #141488; border-color: #5353bc; }
#run:disabled { opacity: .5; }
#stop[data-result="done"], #stop[data-result="stopped"] { background: #a12635; color: #fff; border-color: #e76b78; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.form-row { display: grid; grid-column: 1 / -1; gap: 9px; align-items: start; }
.login-fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.scan-fields { grid-template-columns: minmax(0, 1.22fr) minmax(0, .86fr) minmax(0, 1fr) minmax(0, 1.24fr); }
.backup-fields { grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); }
.form-row label { grid-column: auto; }
.scan-fields label, .range-caption { font-size: .92rem; }
.range-value { display: flex; align-items: center; margin-top: 3px; min-height: 35px; padding: 6px 8px;
    border: 1px solid #59658b; border-radius: 3px; background: #151c31; color: #d9faff;
    font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.folder-control { display: flex; margin-top: 3px; min-width: 0; }
.folder-control input:not([type=checkbox],[type=hidden]) { flex: 1 1 0; min-width: 0; width: auto; margin: 0; }
.folder-control:has(.folder-suffix:not([hidden])) input { border-radius: 3px 0 0 3px; }
.folder-suffix { display: flex; align-items: center; max-width: 55%; padding: 6px 8px;
    border: 1px solid #59658b; border-left: 0; border-radius: 0 3px 3px 0;
    background: #151c31; color: #d9faff; overflow-wrap: anywhere; }
.folder-suffix[hidden] { display: none; }
html[data-theme="light"] :is(.range-value,.folder-suffix) { background: #e7edf4; color: #244565; border-color: #98a9bc; }
.download-actions { display: grid; gap: 6px; }
.download-action { display: grid; grid-template-columns: 9em minmax(0, 1fr); align-items: start;
                   gap: 8px; min-width: 0; border: 1px solid #343952; padding: 7px; }
.download-action p { margin: 2px 0; }
.test-action { margin-top: 8px; }
.repair-section { margin-top: 10px; border-top: 1px solid #59658b; padding-top: 8px; }
.repair-search, .repair-upload { display: grid; align-items: end; gap: 8px; margin-top: 6px; }
.repair-search { grid-template-columns: minmax(0, 1fr) auto minmax(0, 2fr); }
.repair-upload { grid-template-columns: minmax(0, 1fr) auto auto; }
.repair-search label, .repair-upload label { grid-column: auto; min-width: 0; }
#repair-preview-text { white-space: pre-line; }
.hint { margin: 0; color: #aab0c4; font-size: .84rem; }
.status-header { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                 padding: 4px 8px; background: #000088; }
progress { display: block; width: 100%; margin-top: 8px; accent-color: #00bbbb; }
progress[hidden] { display: none; }
#status { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.stage { margin: 10px 0; }
.stage p { margin: 4px 0 0; font-size: .88rem; }
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
            list-style: none; margin: 8px 0; padding: 0; }
.pipeline li { background: #191e31; padding: 4px; text-align: center; font-size: .8rem; }
.pipeline strong { display: block; color: #d1f8f8; font-variant-numeric: tabular-nums; }
.issues { color: #ffdb91; margin: 4px 0; padding-left: 1.2rem; font-size: .84rem; }
.destination { overflow-wrap: anywhere; }
details { margin-top: 8px; color: #aab0c4; font-size: .86rem; }
details p { margin: 4px 0 0; }
summary { cursor: pointer; }
.advanced-fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
dialog { color: inherit; max-width: min(430px, 92vw); }
dialog::backdrop { background: #000a; }
.heading-actions { display: flex; align-items: center; flex-wrap: wrap; gap: .7rem; }
.version { font-size: .8rem; font-variant-numeric: tabular-nums; }
.notice { position: fixed; inset: auto 12px 12px auto; z-index: 2; width: min(24rem, calc(100% - 24px));
          background: #171d2f; color: #eee; border: 1px solid #59658b; border-radius: 5px; padding: 10px 12px;
          box-shadow: 0 4px 18px #0007; }
.notice button { float: right; margin-left: 8px; }
.notice p { margin: 4px 0 0; overflow-wrap: anywhere; white-space: pre-line; }
html[data-theme="light"] body { color-scheme: light; background: #f1f4f7; color: #172b3d; }
html[data-theme="light"] .heading, html[data-theme="light"] .status-header { background: #e7edf4; }
html[data-theme="light"] h1, html[data-theme="light"] a { color: #215987; }
html[data-theme="light"] :is(form,section,dialog) { background: #fff; border-color: #d9e2ec; }
html[data-theme="light"] :is(input:not([type=checkbox]),select,button) { background: #fff; border-color: #98a9bc; }
html[data-theme="light"] #run { color: #fff; background: #215987; }
html[data-theme="light"] :is(.hint,details) { color: #485c6f; }
html[data-theme="light"] .pipeline li { background: #edf3f8; }
html[data-theme="light"] .pipeline strong { color: #16446d; }
html[data-theme="light"] .issues { color: #805100; }
html[data-theme="light"] .download-action, html[data-theme="light"] .notice { border-color: #98a9bc; }
html[data-theme="light"] .notice { background: #fff; color: #172b3d; }
@media (max-width: 760px) {
    body { padding: 10px; }
    main { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    section { grid-row: 1; }
    form, section { padding: 10px; }
}
@media (max-width: 600px) {
    .login-fields, .scan-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .repair-search { grid-template-columns: minmax(0, 1fr) auto; }
    .repair-search label:last-child { grid-column: 1 / -1; }
}
@media (max-width: 430px) {
    .backup-fields { grid-template-columns: minmax(0, 1fr); }
    label { grid-column: span 3; }
    .download-actions { grid-template-columns: 1fr; }
}
</style>
<header class="heading"><h1>BBS文章備份程式</h1><div class="heading-actions">
<span class="version">__APP_VERSION__</span>
<a href="ReadMe.html" target="_blank" rel="noopener">操作說明與紀錄</a>
<button type="button" id="desktop-toggle" aria-pressed="false">啟用桌面通知</button>
<button type="button" id="theme-toggle" aria-pressed="true">切換淺色</button></div></header>
<main>
<form id="form" method="post" autocomplete="off">
<input type="hidden" name="theme" value="dark">
<div class="form-row login-fields">
    <label>站名<select name="site"><option value="PTT2">PTT2</option><option value="PTT">PTT</option></select></label>
    <label>版名<input name="board" required pattern="[A-Za-z0-9_\-]{1,30}"></label>
    <label>帳號<input name="user" required autocomplete="off"></label>
    <label>密碼<input name="password" type="password" required autocomplete="new-password"></label>
</div>
<div class="form-row scan-fields">
    <label>起始編號<input name="start" id="scan-start" type="text" value="0" required autocomplete="off"
        title="0為最新，或可輸入想下載的編號，以逗號分隔" aria-describedby="start-error">
        <small id="start-error" hidden></small></label>
    <label>掃描篇數<input name="count" id="scan-count-input" type="number" min="1" max="10000" value="5" required></label>
    <label>掃描方向<select name="direction" id="scan-direction"><option value="newest">新到舊</option><option value="oldest">舊到新</option></select></label>
    <div>
        <div class="range-caption" id="range-caption">預估下載範圍</div>
        <output class="range-value" id="range-preview" aria-labelledby="range-caption" for="scan-start scan-count-input scan-direction">登入後確認最新編號</output>
    </div>
</div>
<div class="form-row backup-fields">
    <label>下載方式<select name="backup_mode"><option value="fill">補齊備份</option><option value="recheck">重新核對</option></select></label>
    <label>備份完整目錄（子目錄自動生成）
        <div class="folder-control">
            <input name="folder" required placeholder="D:\BBS_Backup\" aria-describedby="folder-suffix">
            <span class="folder-suffix" id="folder-suffix" hidden></span>
        </div>
    </label>
</div>
<div class="download-actions wide">
    <div class="download-action">
        <button id="run" aria-describedby="new-summary">登入新下載</button>
        <p id="new-summary" class="hint destination"></p>
    </div>
    <div class="download-action">
        <button type="button" id="resume" aria-describedby="resume-summary" disabled>登入續傳</button>
        <p id="resume-summary" class="hint destination">選擇看板與備份目錄後查詢續傳。</p>
    </div>
    <div class="download-action">
        <button type="button" id="export" aria-describedby="export-hint">離線內容重整</button>
        <p id="export-hint" class="hint">用本機資料重建全部 HTML，無須登入。</p>
    </div>
</div>
<p id="rate-status" class="hint wide" hidden></p>
<details class="wide" id="test-area"><summary>單篇測試修正</summary>
    <div class="advanced-fields">
        <label class="half">指定文章 AID<input name="test_aid" placeholder="例如 1AdzogFB"></label>
        <label class="half">測試擷取方式<select name="test_capture_mode"><option value="line">逐行 ↓</option><option value="page">逐頁（Page Down）</option></select></label>
        <label class="wide"><input name="test_short_terminal" type="checkbox"> 模擬一般 BBS 的 24 列畫面（相容讀取）</label>
    </div>
    <div class="download-action test-action">
        <button type="button" id="test-download" aria-describedby="test-summary">登入並測試下載</button>
        <p id="test-summary" class="hint destination"></p>
    </div>
    <div class="repair-section">
        <strong>匯入人工 ANSI 備份</strong>
        <div class="repair-search">
            <label>搜尋備份根目錄<input id="repair-root" name="repair_root" placeholder="使用首頁的備份根目錄"></label>
            <button type="button" id="repair-find">查找待查文章</button>
            <label>待查文章<select id="repair-target" disabled><option value="">請先查找待查文章</option></select></label>
        </div>
        <div class="repair-upload">
            <label>本機 ANSI 檔<input id="repair-file" type="file" accept=".ans"></label>
            <button type="button" id="repair-preview" disabled>預覽</button>
            <button type="button" id="repair-confirm" disabled>匯入</button>
        </div>
        <p id="repair-preview-text" class="destination" role="status"></p>
        <a id="repair-index" target="_blank" rel="noopener" hidden>開啟更新後的離線索引</a>
    </div>
</details>
</form>
<section><div class="status-header"><h2>下載狀態</h2><button type="button" id="stop" disabled>停止</button></div>
<p id="status" role="status">尚未開始</p>
<div class="stage"><strong>1. 下載、配色與存檔</strong>
<progress id="progress" aria-label="下載與掃描進度" hidden></progress>
<ol class="pipeline" aria-label="已完成的處理步驟">
    <li>本地讀取<strong id="local-count">—</strong></li>
    <li>網站掃描<strong id="scan-count">—</strong></li>
    <li>無更新<strong id="unchanged-count">0</strong></li>
    <li>已更新<strong id="updated-count">0</strong></li>
    <li>待核色<strong id="color-count">0</strong></li>
</ol>
<p id="range-count"></p>
<details id="issue-details" hidden><summary id="review-count">處理明細</summary><ul id="issues" class="issues" hidden></ul></details></div>
<div class="stage"><strong>2. 建立離線 HTML</strong>
<progress id="export-progress" aria-label="HTML 匯出進度" hidden></progress>
<p id="export-count">等待下載結束</p><p class="destination" id="index-path"></p>
<p class="destination"><a id="index-link" target="_blank" rel="noopener" hidden></a></p></div>
<p id="timing" class="hint"></p><p id="log-path" class="hint destination"></p></section>
</main>
<aside id="notice" class="notice" hidden>
    <button type="button" id="close-notice" aria-label="關閉提醒">×</button>
    <div role="status"><strong id="notice-title"></strong><p id="notice-message"></p></div>
</aside>
<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const start = document.getElementById('run');
const resume = document.getElementById('resume');
const progress = document.getElementById('progress');
const exportProgress = document.getElementById('export-progress');
const exportButton = document.getElementById('export');
const testButton = document.getElementById('test-download');
const stop = document.getElementById('stop');
const folderSuffix = document.getElementById('folder-suffix');
const indexLink = document.getElementById('index-link');
const preferenceFields = ['site', 'user', 'board', 'start', 'count', 'folder', 'theme', 'direction', 'repair_root'];
const themeToggle = document.getElementById('theme-toggle');
const desktopToggle = document.getElementById('desktop-toggle');
const notice = document.getElementById('notice');
const repairRoot = document.getElementById('repair-root');
const repairTarget = document.getElementById('repair-target');
const repairFile = document.getElementById('repair-file');
const repairPreview = document.getElementById('repair-preview');
const repairConfirm = document.getElementById('repair-confirm');
const repairIndex = document.getElementById('repair-index');
let repairTargets = [];
let repairSearchRoot = '';
let repairDraft = null;
let repairRevision = 0;
let repairBusy = false;
const noticeQueue = [];
let noticeTimer;
let issueNoticeTask = '';
let issueNoticeCount = 0;
let resolvedFolder = '';
let preferenceTimer;
let preferenceWrites = Promise.resolve();
let formEdited = false;
let running = false;
let pending = null;
let pendingTimer;
let pendingRequest = 0;
let issueSignature = '';
let lastNoticeTask = '';
let refreshRequest = 0;
let refreshApplied = 0;
let connectionLost = false;
let rateLimits = {};
let lastWaitNotice = '';

function selectedRateLimit() {
    return rateLimits[form.elements.site.value];
}

function updateDownloadButtons() {
    const limit = selectedRateLimit();
    start.disabled = running || Boolean(limit);
    resume.disabled = running || !pending || Boolean(limit);
    exportButton.disabled = running;
    testButton.disabled = running || Boolean(limit);
    updateRepairButtons();
    const status = document.getElementById('rate-status');
    status.hidden = !limit;
    if (limit) {
        const until = new Date(limit.until).toLocaleString('zh-TW', {
            timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        setText(status, `站方限速。最早可在 ${until} 後再確認。`);
    }
}

function getSetting(storage, key) {
    try { return window[storage].getItem(key); } catch { return null; }
}

function setSetting(storage, key, value) {
    try { window[storage].setItem(key, value); } catch {}
}

let desktopEnabled = getSetting('localStorage', 'bbs-desktop-enabled') === 'yes';

function setText(element, value) {
    const target = typeof element === 'string' ? document.getElementById(element) : element;
    const text = String(value);
    if (target.textContent !== text) target.textContent = text;
}

function showNotice(title, message, id) {
    setText('notice-title', title);
    setText('notice-message', message);
    notice.dataset.id = id || '';
    notice.hidden = false;
    if (!id || !desktopEnabled || !window.Notification || Notification.permission !== 'granted') return;
    if (getSetting('localStorage', 'bbs-desktop-last') === id) return;
    try {
        const notification = new Notification(title, {body: message, tag: `bbs-${id}`});
        notification.onclick = () => { window.focus(); notification.close(); };
        setSetting('localStorage', 'bbs-desktop-last', id);
    } catch {
        // The page notice also covers browsers that cannot show system alerts.
    }
}

function showQueuedNotice() {
    if (noticeTimer !== undefined || !noticeQueue.length) return;
    const next = noticeQueue.shift();
    showNotice(next.title, next.message, next.id);
    if (next.article) {
        noticeTimer = setTimeout(() => {
            if (notice.dataset.id === next.id) notice.hidden = true;
            noticeTimer = undefined;
            showQueuedNotice();
        }, 4500);
    }
}

function queueIssueNotices(state) {
    if (!state.task_id) return;
    const key = `bbs-issue-count-${state.task_id}`;
    const issues = state.issues || [];
    if (issueNoticeTask !== state.task_id) {
        issueNoticeTask = state.task_id;
        issueNoticeCount = Number(getSetting('sessionStorage', key) || 0);
    }
    for (let i = issueNoticeCount; i < issues.length; i++) {
        const issue = issues[i];
        if (!issue.notify) continue;
        const label = [state.site, state.board, issue.index == null ? '' : `第 ${issue.index} 篇`,
            issue.aid ? `AID ${issue.aid}` : ''].filter(Boolean).join(' · ');
        const detail = [issue.stage, issue.message, issue.continues ? '繼續下載下一篇' : ''].filter(Boolean).join(' · ');
        noticeQueue.push({title: '文章待查', message: [label, detail].filter(Boolean).join('\n'),
            id: `${state.task_id}-issue-${i + 1}`, article: true});
    }
    issueNoticeCount = Math.max(issueNoticeCount, issues.length);
    setSetting('sessionStorage', key, String(issueNoticeCount));
    showQueuedNotice();
}

function showResult(state) {
    if (state.running || !state.task_id || !state.result || state.task_id === lastNoticeTask) return;
    lastNoticeTask = state.task_id;
    if (getSetting('sessionStorage', 'bbs-last-result') === state.task_id) return;
    setSetting('sessionStorage', 'bbs-last-result', state.task_id);
    const titles = state.operation === 'export'
        ? {done: '離線內容重整完成', failed: '離線內容重整失敗'}
        : {done: '下載完成', stopped: '下載已中止', disconnected: '連線中斷',
            rate_limited: '站方限速',
            pending: '有項目待處理', failed: '下載失敗'};
    const summary = [];
    if (state.batch_total) summary.push(`網站掃描 ${state.scanned}／${state.batch_total}`);
    if (state.updated) summary.push(`已更新 ${state.updated} 篇`);
    if (state.reused_local) summary.push(`沿用本機 ${state.reused_local} 篇`);
    if (state.ansi_review) summary.push(`待核色 ${state.ansi_review} 篇`);
    if (state.unresolved) summary.push(`待查 ${state.unresolved} 筆`);
    if (state.unavailable) summary.push(`刪除、鎖定或無正文 ${state.unavailable} 筆`);
    if (state.index_path) summary.push(`離線 HTML ${state.exported} 篇`);
    noticeQueue.push({title: titles[state.result] || '備份狀態更新',
        message: [state.message, summary.join(' · ')].filter(Boolean).join('\n'), id: state.task_id});
    showQueuedNotice();
}

function updateDesktopToggle() {
    const supported = Boolean(window.Notification) && window.isSecureContext;
    const active = supported && desktopEnabled && Notification.permission === 'granted';
    desktopToggle.disabled = !supported;
    desktopToggle.setAttribute('aria-pressed', String(active));
    setText(desktopToggle, !supported ? '此瀏覽器無法發送桌面通知'
        : active ? '停用桌面通知' : '啟用桌面通知');
}

desktopToggle.onclick = async () => {
    if (desktopToggle.getAttribute('aria-pressed') === 'true') {
        desktopEnabled = false;
        setSetting('localStorage', 'bbs-desktop-enabled', 'no');
        updateDesktopToggle();
        return;
    }
    try {
        if (await Notification.requestPermission() !== 'granted') {
            showNotice('桌面通知未啟用', '可在瀏覽器的網站權限允許通知。頁內提醒會繼續顯示。');
            return;
        }
        desktopEnabled = true;
        setSetting('localStorage', 'bbs-desktop-enabled', 'yes');
        showNotice('桌面通知已啟用', '下載完成、連線中斷或有項目待處理時會提醒。');
    } catch {
        showNotice('桌面通知未啟用', '瀏覽器目前無法取得通知權限。');
    } finally {
        updateDesktopToggle();
    }
};
document.getElementById('close-notice').onclick = () => {
    notice.hidden = true;
    clearTimeout(noticeTimer);
    noticeTimer = undefined;
    showQueuedNotice();
};
window.addEventListener('focus', updateDesktopToggle);
updateDesktopToggle();

function updateFormSummary() {
    const {start, direction, site, board, count, folder, backup_mode,
        test_aid, test_capture_mode, test_short_terminal} = form.elements;
    const raw = start.value.replace(/[０-９]/g, char => String(char.charCodeAt(0) - 0xFF10)).replace(/，/g, ',');
    const parts = raw.split(',').map(part => part.trim());
    const listMode = parts.length > 1;
    const validStart = parts.length <= 10000 && parts.every(part =>
        /^[0-9]{1,10}$/.test(part) && Number(part) <= 2147483647 && (!listMode || Number(part) > 0));
    const error = validStart ? '' : '請輸入一個編號，或用逗號分隔多個正整數。0 只能單獨使用。';
    start.setCustomValidity(error);
    const startError = document.getElementById('start-error');
    startError.textContent = error;
    startError.hidden = !error;
    count.disabled = direction.disabled = listMode;
    const first = Number(parts[0]);
    const amount = Number(count.value);
    const oldestFirst = direction.value === 'oldest';
    const valid = validStart && (listMode || (count.checkValidity() && Number.isSafeInteger(first + amount - 1)));
    let estimate = '請確認編號與篇數';
    let range = estimate;
    if (valid && listMode) {
        const selected = [...new Set(parts.map(Number))];
        estimate = `指定 ${selected.length} 篇`;
        range = selectedRange(selected);
    } else if (valid && first === 0) {
        estimate = '登入後確認最新編號';
        range = oldestFirst ? '從最新一篇起 · 舊到新 · 只掃最新一篇' : `從最新一篇起 · 最多 ${amount} 篇 · 新到舊`;
    } else if (valid) {
        const last = oldestFirst ? first + amount - 1 : Math.max(1, first - amount + 1);
        estimate = `${first} → ${last}`;
        range = `${estimate} · 最多 ${Math.abs(first - last) + 1} 篇 · ${oldestFirst ? '舊到新' : '新到舊'}`;
    }
    setText('range-preview', estimate);
    document.getElementById('range-preview').title = valid && listMode ? range
        : valid && first > 0 ? '實際掃描範圍以登入時的看板編號為準' : '';
    const name = archiveName();
    const actualLeaf = resolvedFolder.split(/[\\/]/).filter(Boolean).at(-1);
    folderSuffix.hidden = !name || Boolean(resolvedFolder && actualLeaf?.toLowerCase() !== name.toLowerCase());
    setText('folder-suffix', name);
    const root = rootFolder(folder.value);
    const path = resolvedFolder || (root && name ? root.replace(/[\\/]+$/, '') + '\\' + name : root);
    const warning = pending ? `。將取代未完成範圍 ${pendingRange(pending)}` : '';
    setText('new-summary', `${backupLabel(backup_mode.value)} · ${range} · ${path || '未填備份目錄'}${warning}`);
    const testAid = test_aid.value.trim().replace(/^#/, '');
    const height = test_short_terminal.checked ? 24 : 100;
    const testMode = test_capture_mode.value;
    const testMethod = testMode === 'page' ? '逐頁（Page Down）' : '逐行 ↓';
    const destination = testAid && board.value
        ? `test-downloads/${site.value}_${board.value}/${testAid}/${testMode}-${height}/`
        : 'test-downloads/';
    setText('test-summary', `${testMethod} · ${height} 列 · 每次在 ${destination} 建立新測試目錄。`);
    showResumeSummary();
}

function backupLabel(mode) {
    return mode === 'fill' ? '補齊備份' : '重新核對';
}

function selectedRange(indices) {
    const preview = indices.slice(0, 6).join('、') + (indices.length > 6 ? '…' : '');
    return `指定 ${indices.length} 篇（${preview}）· 依輸入順序`;
}

function pendingRange({first, last, direction, selected_indices}) {
    if (selected_indices?.length) return selectedRange(selected_indices);
    return direction === 'oldest' ? `${first} → ${last} · 舊到新` : `${last} → ${first} · 新到舊`;
}

function showResumeSummary() {
    if (!pending) return;
    const {reusable, backup_mode} = pending;
    setText('resume-summary', `上次未完成：${pendingRange(pending)} · ${backupLabel(backup_mode)} · 已有 ${reusable} 篇可沿用`);
}

function checkPending() {
    clearTimeout(pendingTimer);
    const request = ++pendingRequest;
    pending = null;
    resolvedFolder = '';
    updateFormSummary();
    updateDownloadButtons();
    const {site, board, folder} = form.elements;
    if (!board.value || !board.checkValidity() || !folder.value) {
        setText('resume-summary', '選擇看板與備份目錄後查詢續傳。');
        return;
    }
    setText('resume-summary', '正在查詢未完成批次…');
    pendingTimer = setTimeout(async () => {
        try {
            const response = await fetch('/pending', {
                method: 'POST', headers: {'Content-Type': 'application/json', 'X-Token': '__TOKEN__'},
                body: JSON.stringify({site: site.value, board: board.value, folder: rootFolder(folder.value)})
            });
            if (!response.ok) throw Error('pending');
            const result = await response.json();
            if (request !== pendingRequest) return;
            resolvedFolder = result.folder || '';
            pending = result.pending || null;
            if (!pending) setText('resume-summary', '這個看板與目錄沒有未完成批次。');
            updateFormSummary();
            updateDownloadButtons();
        } catch {
            if (request === pendingRequest) setText('resume-summary', '無法查詢續傳，請確認備份目錄。');
        }
    }, 180);
}

function applyTheme(value) {
    const theme = value === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    form.elements.theme.value = theme;
    themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
    themeToggle.textContent = theme === 'dark' ? '切換淺色' : '切換深色';
}
themeToggle.onclick = () => {
    formEdited = true;
    applyTheme(form.elements.theme.value === 'dark' ? 'light' : 'dark');
    saveForm();
};

function archiveName() {
    const {site, board} = form.elements;
    return board.value && board.checkValidity() ? `${site.value}_${board.value}` : '';
}

function rootFolder(value) {
    const path = value.trim();
    const trimmed = path.replace(/[\\/]+$/, '');
    const separator = Math.max(trimmed.lastIndexOf('\\'), trimmed.lastIndexOf('/'));
    const leaf = trimmed.slice(separator + 1);
    if (separator >= 0 && leaf.toLowerCase() === archiveName().toLowerCase()) {
        return trimmed.slice(0, separator + 1);
    }
    return path;
}

function saveForm() {
    clearTimeout(preferenceTimer);
    const data = Object.fromEntries(preferenceFields.map(key => [key, form.elements[key].value]));
    data.folder = rootFolder(data.folder);
    preferenceWrites = preferenceWrites.then(() => fetch('/preferences', {
        method: 'POST', keepalive: true,
        headers: {'Content-Type': 'application/json', 'X-Token': '__TOKEN__'}, body: JSON.stringify(data)
    })).then(response => {
        if (!response.ok) throw Error('preferences');
    }).catch(() => { showNotice('無法儲存欄位設定', '請確認本機程式仍在執行。'); });
}

form.addEventListener('input', event => {
    updateFormSummary();
    if (['site', 'board', 'folder'].includes(event.target.name)) {
        checkPending();
    }
    if (!preferenceFields.includes(event.target.name)) return;
    formEdited = true;
    clearTimeout(preferenceTimer);
    preferenceTimer = setTimeout(saveForm, 300);
});
form.addEventListener('change', event => {
    if (['site', 'board', 'folder'].includes(event.target.name)) {
        if (event.target.name === 'folder') form.elements.folder.value = rootFolder(form.elements.folder.value);
        checkPending();
        saveForm();
    }
});
fetch('/preferences').then(response => response.json()).then(values => {
    if (formEdited) return;
    for (const name of preferenceFields) {
        if (typeof values[name] === 'string') form.elements[name].value = values[name];
    }
    form.elements.folder.value = rootFolder(form.elements.folder.value);
    applyTheme(values.theme);
    if (!form.elements.direction.value) form.elements.direction.value = 'newest';
    updateFormSummary();
    checkPending();
}).catch(() => {});
updateFormSummary();

async function send(path, data) {
    try {
        const response = await fetch(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Token': '__TOKEN__'},
            body: JSON.stringify(data)
        });
        if (!response.ok) {
            const error = await response.json();
            showNotice('無法啟動操作', error.error || (error.no_pending ? '找不到未完成批次。'
                : error.rate_limit ? '站方限速仍在生效，請等到頁面顯示的時間後再續傳。'
                : response.status === 403 ? '本機程式可能已重新啟動，請重新整理頁面。'
                : response.status === 409 ? '另一個任務正在執行。' : '請確認欄位與資料夾完整路徑。'));
            checkPending();
        } else if (path !== '/stop') {
            if (data.mode !== 'test') {
                checkPending();
                saveForm();
            }
        }
        await pollStatus();
    } catch {
        showNotice('無法連線到本機程式', '請確認啟動視窗仍開著。');
    }
}

function updateRepairButtons() {
    document.getElementById('repair-find').disabled = repairBusy;
    repairTarget.disabled = repairBusy || !repairTargets.length;
    repairRoot.disabled = repairFile.disabled = repairBusy;
    repairPreview.disabled = repairBusy || !repairTarget.value || !repairFile.files.length;
    repairConfirm.disabled = repairBusy || running || !repairDraft;
}

function clearRepairPreview() {
    repairRevision++;
    repairDraft = null;
    repairIndex.hidden = true;
    setText('repair-preview-text', '');
    updateRepairButtons();
}

function clearRepairTargets() {
    repairTargets = [];
    repairSearchRoot = '';
    repairTarget.replaceChildren(new Option('請先查找待查文章', ''));
    clearRepairPreview();
}

async function repairRequest(path, data) {
    const response = await fetch(path, {method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Token': '__TOKEN__'}, body: JSON.stringify(data)});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '請確認備份目錄和檔案，或重新整理頁面。');
    return result;
}

function repairLabel(target) {
    return `${target.site}／${target.board}／第 ${target.index} 篇 · AID ${target.aid}`;
}

function renderRepairTargets() {
    const counts = new Map();
    for (const target of repairTargets) {
        const label = repairLabel(target);
        counts.set(label, (counts.get(label) || 0) + 1);
    }
    repairTarget.replaceChildren(new Option(repairTargets.length ? '請選擇一筆待查文章' : '沒有待匯入的文章', ''),
        ...repairTargets.map((target, index) => {
            const label = repairLabel(target);
            const folderName = target.folder.split(/[\\/]/).filter(Boolean).at(-1);
            return new Option(counts.get(label) > 1 ? `${label} · ${folderName}` : label, String(index));
        }));
}

async function runRepair(action) {
    if (repairBusy) return;
    repairBusy = true;
    updateRepairButtons();
    try {
        await action();
    } catch (error) {
        setText('repair-preview-text', error.message || '無法連線到本機程式。');
    } finally {
        repairBusy = false;
        updateRepairButtons();
    }
}

document.getElementById('repair-find').onclick = () => runRepair(async () => {
    clearRepairTargets();
    const revision = repairRevision;
    const root = repairRoot.value.trim() || rootFolder(form.elements.folder.value);
    const result = await repairRequest('/repair-targets', {root});
    if (revision !== repairRevision) return;
    repairRoot.value = root;
    formEdited = true;
    saveForm();
    repairSearchRoot = root;
    repairTargets = result.targets;
    renderRepairTargets();
    setText('repair-preview-text', repairTargets.length ? '' : '找不到符合條件的待查紀錄。');
});
repairRoot.addEventListener('input', clearRepairTargets);
repairRoot.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        document.getElementById('repair-find').click();
    }
});
repairTarget.onchange = repairFile.onchange = clearRepairPreview;
form.elements.folder.addEventListener('input', () => {
    if (!repairRoot.value.trim()) clearRepairTargets();
});
repairPreview.onclick = () => runRepair(async () => {
    clearRepairPreview();
    const revision = repairRevision;
    const target = repairTargets[Number(repairTarget.value)];
    const file = repairFile.files[0];
    if (!target || !file || !file.name.toLowerCase().endsWith('.ans') || file.size > 4 * 1024 * 1024) {
        throw new Error('請選擇一筆待查文章及 4 MB 以下的 .ans 檔。');
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = '';
    for (let offset = 0; offset < bytes.length; offset += 32768)
        binary += String.fromCharCode(...bytes.subarray(offset, offset + 32768));
    const payload = {...target, root: repairSearchRoot, file: btoa(binary), filename: file.name};
    const result = await repairRequest('/repair-preview', payload);
    if (revision !== repairRevision) return;
    repairDraft = {...payload, ticket: result.ticket};
    const encoding = result.decode_replacements ? `\n${result.decode_replacements} 處無法解碼，原始檔會保留。` : '';
    setText('repair-preview-text', `${file.name} · ${result.title}\n匯入 ${repairLabel(target)}\n${result.folder}${encoding}`);
});
repairConfirm.onclick = () => runRepair(async () => {
    if (!repairDraft) return;
    const draft = repairDraft;
    const revision = repairRevision;
    const result = await repairRequest('/repair-import', draft);
    if (revision !== repairRevision) return;
    repairTargets = repairTargets.filter(target => !(target.folder === draft.folder && target.site === draft.site
        && target.board === draft.board && target.index === draft.index && target.aid === draft.aid));
    renderRepairTargets();
    clearRepairPreview();
    repairFile.value = '';
    if (result.index_url) {
        repairIndex.href = result.index_url;
        repairIndex.hidden = false;
    }
    const message = result.index_url ? '已匯入人工備份並更新離線索引。'
        : '人工備份已存檔。離線索引未能更新，請執行「離線內容重整」。';
    setText('repair-preview-text', `${message}\n${result.folder}`);
});

form.addEventListener('submit', event => {
    event.preventDefault();
    updateFormSummary();
    if (!form.reportValidity()) return;
    const data = Object.fromEntries(new FormData(form));
    data.folder = rootFolder(data.folder);
    form.elements.password.value = '';
    for (const key of ['test_aid', 'test_capture_mode', 'test_short_terminal', 'repair_root']) delete data[key];
    updateFormSummary();
    saveForm();
    send('/start', {...data, mode: 'new'});
});
resume.onclick = () => {
    const {site, board, folder, user, password} = form.elements;
    if (![board, folder, user, password].every(field => field.reportValidity())) return;
    send('/start', {mode: 'resume', site: site.value, board: board.value, folder: rootFolder(folder.value),
        user: user.value, password: password.value});
    password.value = '';
};
testButton.onclick = () => {
    const {site, board, user, password, test_aid, test_capture_mode, test_short_terminal} = form.elements;
    if (![board, user, password].every(field => field.reportValidity())) return;
    const aid = test_aid.value.trim().replace(/^#/, '');
    if (!/^[A-Za-z0-9_-]{8}$/.test(aid)) {
        showNotice('請輸入文章 AID', '請在單篇測試修正區填寫 8 碼文章代碼。');
        test_aid.focus();
        return;
    }
    send('/start', {mode: 'test', site: site.value, board: board.value, user: user.value, password: password.value,
        aid, capture_mode: test_capture_mode.value, short_terminal: test_short_terminal.checked ? 'on' : ''});
    password.value = '';
    test_aid.value = '';
    updateFormSummary();
};
form.elements.test_aid.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        testButton.click();
    }
});
exportButton.onclick = () => {
    const {folder, site, board} = form.elements;
    if (folder.reportValidity() && board.reportValidity()) {
        send('/export', {folder: rootFolder(folder.value), site: site.value, board: board.value});
    }
};
stop.onclick = () => send('/stop', {});

async function refresh() {
    const request = ++refreshRequest;
    const response = await fetch('/status');
    if (!response.ok) throw Error('status');
    const state = await response.json();
    if (request < refreshApplied) return;
    refreshApplied = request;
    connectionLost = false;
    const finished = !state.running && (running || (state.result && state.task_id !== lastNoticeTask));
    running = state.running;
    rateLimits = state.rate_limits || {};
    if (running && state.wait_until) {
        const waitId = `${state.task_id}-wait-${state.wait_until}`;
        if (waitId !== lastWaitNotice) {
            lastWaitNotice = waitId;
            showNotice(state.wait_kind === 'rate_limit' ? '站方限速' : '看板暫時關閉', state.message, waitId);
        }
    }
    if (finished) checkPending();
    queueIssueNotices(state);
    showResult(state);
    updateDownloadButtons();
    stop.disabled = !running || state.phase === 'export' || state.operation === 'export';
    const downloadResult = state.operation === 'download' ? state.result : null;
    stop.dataset.result = downloadResult || '';
    setText(stop, {done: '完成', stopped: '中止', disconnected: '連線中斷',
        failed: '失敗', pending: '待續傳', rate_limited: '站方限速'}[downloadResult] || '停止');
    const selection = window.getSelection();
    if (selection && !selection.isCollapsed && selection.containsNode(status.closest('section'), true)) return;
    setText(status, state.message);
    progress.hidden = !state.batch_total;
    let scan = '—';
    let range = '';
    if (state.batch_total) {
        progress.max = state.batch_total;
        progress.value = state.scanned;
        scan = `${state.scanned}／${state.batch_total}`;
        if (state.selected_indices?.length) {
            range = `${state.resumed ? '接續' : '本次'}${selectedRange(state.selected_indices)}`;
        } else if (state.batch_start) {
            const ascending = state.direction === 'oldest';
            range = `${state.resumed ? '接續' : '本次'}範圍 ${ascending ? state.batch_start : state.batch_end} → ${ascending ? state.batch_end : state.batch_start}`;
        }
    }
    setText('scan-count', scan);
    setText('range-count', [range, state.reused_local ? `沿用本機 ${state.reused_local} 篇` : ''].filter(Boolean).join(' · '));
    setText('local-count', state.local_count ?? '—');
    setText('unchanged-count', state.skipped ?? 0);
    setText('updated-count', state.updated ?? 0);
    setText('color-count', state.ansi_review ?? 0);
    const review = [];
    if (state.resumed_verified) review.push(`沿用 ${state.resumed_verified} 篇`);
    if (state.unresolved) review.push(`文章待查 ${state.unresolved} 筆`);
    if (state.unavailable) review.push(`刪除、鎖定或無正文 ${state.unavailable} 筆`);
    if (state.kept_previous) review.push(`保留舊備份 ${state.kept_previous} 篇`);
    if (state.ansi_review) review.push(`配色待核對 ${state.ansi_review} 篇`);
    const issues = document.getElementById('issues');
    const issueList = state.issues || [];
    document.getElementById('issue-details').hidden = !review.length && !issueList.length;
    setText('review-count', ['處理明細', ...review].join(' · '));
    const signature = JSON.stringify(issueList);
    if (signature !== issueSignature) {
        const rows = document.createDocumentFragment();
        for (const issue of issueList) {
            const row = document.createElement('li');
            const label = [issue.index, issue.aid].filter(value => value != null).join(' / ');
            row.textContent = [label, issue.stage, issue.message].filter(Boolean).join(' · ');
            rows.append(row);
        }
        issues.replaceChildren(rows);
        issues.hidden = !issueList.length;
        issueSignature = signature;
    }
    exportProgress.hidden = state.phase !== 'export' || !state.export_total;
    exportProgress.max = state.export_total || 1;
    exportProgress.value = state.exported || 0;
    setText('export-count', state.index_path
        ? `離線 HTML 共 ${state.exported} 篇 · 本次寫入 ${state.html_written ?? state.exported} 篇`
        : state.phase === 'export' || state.export_total
            ? `已處理 ${state.exported}／${state.export_total} 篇 HTML`
            : '等待下載結束');
    setText('index-path', !state.index_url && state.folder ? `實際備份位置：${state.folder}` : '');
    indexLink.hidden = !state.index_url;
    if (state.index_url) {
        indexLink.href = state.index_url;
        setText(indexLink, state.operation === 'test' ? `開啟測試結果 · ${state.index_path}` : state.index_path);
    }
    let timing = state.elapsed ? `已用時 ${Math.floor(state.elapsed / 60)} 分 ${state.elapsed % 60} 秒` : '';
    if (state.seconds_per_article) {
        timing += ` · 本次 ${state.timed_samples} 篇的平均下載時間 ${state.seconds_per_article} 秒／篇`;
    }
    setText('timing', timing);
    setText('log-path', state.log_path ? `診斷紀錄：${state.log_path}` : '');
}
async function pollStatus() {
    try {
        await refresh();
    } catch {
        if (!running || connectionLost) return;
        connectionLost = true;
        showNotice('無法連線到本機程式', '暫時無法取得下載狀態，請確認啟動視窗仍開著。',
            `local-connection-${Date.now()}`);
    }
}
pollStatus();
setInterval(pollStatus, 1000);
</script></html>
