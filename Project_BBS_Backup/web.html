<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>PTT2 文章備份</title>
<style>body{font:17px system-ui;background:#f1f4f7;color:#172b3d;max-width:760px;margin:40px auto;padding:20px}form,section{background:white;padding:24px;border-radius:12px;margin:16px 0}label{display:block;margin:14px 0}input{display:block;width:95%;padding:10px;font:inherit;border:1px solid #abc;border-radius:5px}button{padding:12px 20px;margin-right:12px;cursor:pointer}p{line-height:1.7}#status{white-space:pre-wrap}</style>
<h1>PTT2 文章備份 · 測試版</h1><p>先用公開板下載 5 篇，確認內容後再擴大。僅支援 WSS 一般文章；精華區、SSH、二階段驗證接續與置底文另行盤點尚未實作。</p>
<form id="form" method="post" autocomplete="off">
<label>帳號<input name="user" required autocomplete="off"></label>
<label>密碼（只供這次登入）<input name="password" type="password" required autocomplete="new-password"></label>
<label>英文板名<input name="board" required pattern="[A-Za-z0-9_-]{1,30}"></label>
<label>起始編號（0＝從最新幾篇開始）<input name="start" type="number" min="0" value="0" required></label>
<label>本次掃描篇數<input name="count" type="number" min="1" max="10000" value="5" required></label>
<label>備份資料夾完整路徑（請自行選擇是否放在 OneDrive）<input name="folder" required placeholder="例如 C:\Users\NICK\Documents\PTT2-Backup"></label>
<button id="start">登入並開始</button><button type="button" id="stop">停止</button>
</form><section><h2>下載狀態</h2><p id="status">尚未開始</p><p>已保存的文章會立即寫入資料庫。結束或發生錯誤時產生 index.html，可離線開啟。重跑會依 AID 略過已下載文章；如板上有刪文造成編號移動，請重新掃描完整範圍。</p></section>
<script>const token='__TOKEN__';async function send(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(data)});if(!r.ok)throw Error('請求失敗 '+r.status)}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await send('/start',d);e.target.password.value=''}catch(x){alert(x.message)}};document.querySelector('#stop').onclick=()=>send('/stop',{});setInterval(async()=>{try{let s=await(await fetch('/status')).json();document.querySelector('#status').textContent=s.message+'\n本次新增：'+s.saved+'　略過／待核對：'+s.skipped;document.querySelector('#start').disabled=s.running}catch{}},1000);</script></html>
