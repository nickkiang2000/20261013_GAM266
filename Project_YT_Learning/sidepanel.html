<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Knowledge Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="videoTitle" class="muted">等待 YouTube 影片…</div>
    <div class="captionMeta">
      <span id="status" class="status">等待影片資訊</span>
      <span id="transcriptSourceLabel" class="transcriptSource">等待字幕</span>
    </div>
  </header>
  <main>
    <section class="knowledgeSection">
      <div class="knowledgeHeading"><h2>知識專有名詞</h2><span class="liveLegend"><i></i>影片目前提及</span></div>
      <div id="termStatus" class="hint">等待逐字稿</div>
      <div id="termList" class="terms empty">尚無專有名詞</div>
      <button id="moreTermsBtn" class="secondary moreTerms" hidden>想了解更多</button>
    </section>
    <details>
      <summary>投資學習・台美股</summary>
      <div id="tickerResults" class="hint">展開後比對目前字幕</div>
    </details>
    <details>
      <summary>工具與除錯</summary>
      <div class="toolbar bottomTools">
        <button id="refreshBtn">重新檢查逐字稿</button>
        <button id="exportBtn" class="secondary">匯出 JSON</button>
      </div>
      <h3>手動貼上逐字稿（備援）</h3>
      <p class="hint">支援 YouTube 複製格式（例如「3:103 分 10 秒字幕文字」）、SRT、VTT，以及一般純文字。匯入後會取代本影片的主要逐字稿，但不會刪除即時觀察紀錄。</p>
      <textarea id="pasteArea" rows="7" placeholder="在此貼上 YouTube 逐字稿…"></textarea>
      <button id="importBtn">解析並匯入</button>
      <div id="importStatus" class="hint"></div>
      <h3>字幕擷取系統變數</h3>
      <pre id="diagnostics" class="diagnostics">尚無診斷資料</pre>
    </details>
    <footer>母語偏好：中文</footer>
  </main>
  <script src="transcript-utils.js"></script>
  <script src="term-extractor.js"></script>
  <script src="tickers.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
